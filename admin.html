<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB TECH - لوحة التحكم</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], textarea, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #218838; }
        .product-list { margin-top: 20px; }
        .product-item { background: #f9f9f9; padding: 10px; border: 1px solid #ddd; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
        .product-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .delete-btn:hover { background: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <h2>إدارة لابتوبات LAB TECH</h2>
    
    <form id="productForm">
        <div class="form-group">
            <label>اسم اللابتوب والمواصفات المختصرة:</label>
            <input type="text" id="productName" required placeholder="مثال: Dell Latitude i5 الجيل الثامن">
        </div>
        
        <div class="form-group">
            <label>السعر (بالجنيه):</label>
            <input type="number" id="productPrice" required placeholder="مثال: 12500">
        </div>

        <div class="form-group">
            <label>التفاصيل والمواصفات الكاملة:</label>
            <textarea id="productSpecs" rows="3" required placeholder="الرامات، الهارد، كارت الشاشة..."></textarea>
        </div>

        <div class="form-group">
            <label>صور اللابتوب (يمكنك اختيار عدة صور معاً):</label>
            <input type="file" id="productImages" accept="image/*" multiple required>
            <small style="color: #666; display: block; margin-top: 4px;">اضغط على زر اختيار الملفات وحدد أكثر من صورة دفعة واحدة.</small>
        </div>

        <button type="submit">إضافة اللابتوب للموقع</button>
    </form>

    <div class="product-list">
        <h3>اللابتوبات الحالية في المستودع:</h3>
        <div id="adminProductsContainer"></div>
    </div>
</div>

<script>
    // دالة لتحويل عدة صور إلى مصفوفة Base64
    function getImagesBase64(fileInput) {
        return new Promise((resolve) => {
            const files = Array.from(fileInput.files);
            if (files.length === 0) return resolve([]);
            
            const promises = files.map(file => {
                return new Promise((res) => {
                    const reader = new FileReader();
                    reader.onload = (e) => res(e.target.result);
                    reader.readAsDataURL(file);
                });
            });
            
            Promise.all(promises).then(imagesBase64 => resolve(imagesBase64));
        });
    }

    // جلب المنتجات من localStorage
    function getProducts() {
        return JSON.parse(localStorage.getItem('labtech_products')) || [];
    }

    // حفظ المنتجات
    function saveProducts(products) {
        localStorage.setItem('labtech_products', JSON.stringify(products));
    }

    // عرض المنتجات في لوحة التحكم
    function renderAdminProducts() {
        const container = document.getElementById('adminProductsContainer');
        const products = getProducts();
        container.innerHTML = '';

        if (products.length === 0) {
            container.innerHTML = '<p style="color: #777;">لا توجد لابتوبات مضافة حالياً.</p>';
            return;
        }

        products.forEach((product, index) => {
            const firstImg = product.images && product.images.length > 0 ? product.images[0] : 'logo.jpg';
            const count = product.images ? product.images.length : 0;
            
            const div = document.createElement('div');
            div.className = 'product-item';
            div.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img src="${firstImg}" alt="${product.name}">
                    <div>
                        <strong>${product.name}</strong><br>
                        <span style="color: green; font-weight: bold;">${product.price} جنيه</span> | 
                        <span style="color: #555; font-size: 12px;">(${count} صور مرفوعة)</span>
                    </div>
                </div>
                <button class="delete-btn" onclick="deleteProduct(${index})">حذف</button>
            `;
            container.appendChild(div);
        });
    }

    // حذف منتج
    function deleteProduct(index) {
        if (confirm('هل أنت متأكد من حذف هذا اللابتوب؟')) {
            const products = getProducts();
            products.splice(index, 1);
            saveProducts(products);
            renderAdminProducts();
        }
    }

    // معالجة إرسال النموذج وإضافة المنتج
    document.getElementById('productForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const name = document.getElementById('productName').value;
        const price = document.getElementById('productPrice').value;
        const specs = document.getElementById('productSpecs').value;
        const imageInput = document.getElementById('productImages');

        const imagesArray = await getImagesBase64(imageInput);

        const newProduct = {
            id: Date.now(),
            name: name,
            price: price,
            specs: specs,
            images: imagesArray // حفظ مصفوفة الصور
        };

        const products = getProducts();
        products.push(newProduct);
        saveProducts(products);

        alert('تم إضافة اللابتوب بنجاح!');
        document.getElementById('productForm').reset();
        renderAdminProducts();
    });

    // تشغيل الدالة عند تحميل الصفحة
    renderAdminProducts();
</script>

</body>
</html>
