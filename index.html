<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB TECH - متجر اللابتوبات</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f9f9f9; margin: 0; padding: 0; direction: rtl; }
        header { background: #222; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 22px; color: #28a745; }
        
        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        
        .product-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        .product-card img.main-img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; background: #eee; }
        
        .thumbnails-container { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; padding-bottom: 5px; }
        .thumbnails-container img { width: 45px; height: 45px; object-fit: cover; cursor: pointer; border: 2px solid transparent; border-radius: 4px; transition: 0.2s; }
        .thumbnails-container img:hover, .thumbnails-container img.active { border-color: #007bff; }
        
        .product-card h3 { margin: 10px 0 5px 0; font-size: 18px; color: #333; }
        .product-card p { color: #666; font-size: 14px; margin: 0 0 10px 0; line-height: 1.4; }
        .price { color: #28a745; font-weight: bold; font-size: 17px; margin-bottom: 10px; display: block; }
        
        .whatsapp-btn { background: #25d366; color: white; text-align: center; padding: 8px; text-decoration: none; border-radius: 4px; font-weight: bold; display: block; }
        .whatsapp-btn:hover { background: #1ebe5d; }
        
        .no-products { text-align: center; color: #777; grid-column: 1 / -1; padding: 40px; font-size: 18px; }
    </style>
</head>
<body>

<header>
    <h1>LAB TECH</h1>
</header>

<div class="container">
    <h2 style="color: #333; border-bottom: 2px solid #ddd; padding-bottom: 10px;">عروض اللابتوبات المتاحة</h2>
    <div class="products-grid" id="storeProductsContainer">
        <!-- سيتم جلب اللابتوبات هنا تلقائياً -->
    </div>
</div>

<script>
    // دالة تغيير الصورة الأساسية عند الضغط على أي صورة مصغرة
    function changeMainImage(thumbElement, mainImgId) {
        const mainImg = document.getElementById(mainImgId);
        if (mainImg) {
            mainImg.src = thumbElement.src;
            
            const container = thumbElement.parentElement;
            container.querySelectorAll('img').forEach(img => img.classList.remove('active'));
            thumbElement.classList.add('active');
        }
    }

    // عرض المنتجات في المتجر الرئيسي
    function renderStoreProducts() {
        const container = document.getElementById('storeProductsContainer');
        const products = JSON.parse(localStorage.getItem('labtech_products')) || [];
        container.innerHTML = '';

        if (products.length === 0) {
            container.innerHTML = '<div class="no-products">لا توجد لابتوبات متاحة حالياً. ترقبوا أحدث العروض قريباً!</div>';
            return;
        }

        products.forEach(product => {
            const images = product.images && product.images.length > 0 ? product.images : [product.image || 'logo.jpg'];
            const primaryImage = images[0];
            const mainImgId = `main-img-${product.id}`;

            let thumbnailsHTML = '';
            if (images.length > 1) {
                thumbnailsHTML = `<div class="thumbnails-container">`;
                images.forEach((imgSrc, idx) => {
                    const activeClass = idx === 0 ? 'active' : '';
                    thumbnailsHTML += `<img src="${imgSrc}" class="${activeClass}" onclick="changeMainImage(this, '${mainImgId}')">`;
                });
                thumbnailsHTML += `</div>`;
            }

            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <div>
                    <img id="${mainImgId}" class="main-img" src="${primaryImage}" alt="${product.name}">
                    ${thumbnailsHTML}
                    <h3>${product.name}</h3>
                    <p>${product.specs}</p>
                    <span class="price">${product.price} جنيه</span>
                </div>
                <a href="https://wa.me/201061543727?text=مرحباً، أنا مهتم بشراء لابتوب: ${encodeURIComponent(product.name)} بسعر ${product.price} جنيه" target="_blank" class="whatsapp-btn">اطلب عبر واتساب</a>
            `;
            container.appendChild(card);
        });
    }

    renderStoreProducts();
</script>

</body>
</html>
